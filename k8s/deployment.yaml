apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-mcp-server
  namespace: mealie-mcp
  labels:
    app: mealie-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie-mcp-server
  template:
    metadata:
      labels:
        app: mealie-mcp-server
    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      # MCP Server container
      - name: mcp-server
        image: ghcr.io/harris-boyce/boycivenga-iac/mealie-mcp-server:v1.0-ha-async
        imagePullPolicy: Always
        
        # Environment variables
        env:
        - name: MCP_TRANSPORT
          value: "sse"
        - name: MCP_PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MEALIE_BASE_URL
          valueFrom:
            secretKeyRef:
              name: mealie-credentials
              key: MEALIE_BASE_URL
        - name: MEALIE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mealie-credentials
              key: MEALIE_API_KEY
        # Home Assistant configuration (optional)
        - name: HA_URL
          valueFrom:
            secretKeyRef:
              name: mealie-credentials
              key: HA_URL
              optional: true
        - name: HA_TOKEN
          valueFrom:
            secretKeyRef:
              name: mealie-credentials
              key: HA_TOKEN
              optional: true
        
        # Container ports
        ports:
        - name: mcp
          containerPort: 8000
          protocol: TCP
        
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      # Caddy sidecar container
      - name: caddy
        image: caddy:2-alpine
        imagePullPolicy: IfNotPresent
        
        # Container ports
        ports:
        - name: https
          containerPort: 443
          protocol: TCP
        - name: http
          containerPort: 80
          protocol: TCP
        
        # Volume mounts
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy
          readOnly: true
        - name: caddy-data
          mountPath: /data
        - name: caddy-config-cache
          mountPath: /config
        
        # Resource limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      # Volumes
      volumes:
      - name: caddy-config
        configMap:
          name: caddy-config
      - name: caddy-data
        persistentVolumeClaim:
          claimName: caddy-data
      - name: caddy-config-cache
        emptyDir: {}
      
      # Image pull secrets for private GHCR registry
      # Uncomment if image is private (create secret with create-image-pull-secret.sh)
      # imagePullSecrets:
      # - name: ghcr-secret
