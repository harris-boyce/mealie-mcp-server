apiVersion: v1
kind: Secret
metadata:
  name: mealie-credentials
  namespace: mealie-mcp
type: Opaque
stringData:
  # Mealie configuration (required)
  # Replace these values with your actual Mealie instance details
  MEALIE_BASE_URL: "https://your-mealie-instance.com"
  MEALIE_API_KEY: "your-mealie-api-key"
  
  # Home Assistant configuration (optional)
  # Leave empty or remove if not using Home Assistant integration
  HA_URL: "https://your-homeassistant-instance.com"
  HA_TOKEN: "your-ha-long-lived-access-token"
