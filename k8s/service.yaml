apiVersion: v1
kind: Service
metadata:
  name: mealie-mcp-server
  namespace: mealie-mcp
  labels:
    app: mealie-mcp-server
spec:
  type: NodePort
  selector:
    app: mealie-mcp-server
  ports:
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
    nodePort: 30443  # External access port (customize if needed)
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30080  # For Let's Encrypt HTTP-01 challenge
