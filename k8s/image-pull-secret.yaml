# Manual creation of image pull secret for GHCR
# This is a template - actual secret should be created using create-image-pull-secret.sh
# or manually with kubectl create secret docker-registry command
#
# DO NOT commit actual credentials to git!
#
# To create manually:
# kubectl create secret docker-registry ghcr-secret \
#   --namespace=mealie-mcp \
#   --docker-server=ghcr.io \
#   --docker-username=YOUR_GITHUB_USERNAME \
#   --docker-password=YOUR_GITHUB_TOKEN \
#   --docker-email=YOUR_EMAIL

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: mealie-mcp
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-encoded-docker-config>
