apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: mealie-mcp
data:
  Caddyfile: |
    {
      # Global options
      email admin@example.com  # Replace with your email for Let's Encrypt
      admin off
      log {
        output stdout
        format json
      }
    }

    # External service with Let's Encrypt certificate
    # Replace 'mcp.example.com' with your actual domain
    mcp.example.com {
      # Let's Encrypt will automatically provision and renew certificates
      # Uses HTTP-01 challenge by default
      
      # Reverse proxy to MCP server on localhost:8000
      reverse_proxy localhost:8000 {
        # Health check configuration
        health_uri /health
        health_interval 10s
        health_timeout 5s
      }
      
      # Logging
      log {
        output stdout
        format json
      }
      
      # Response headers
      header {
        # Security headers
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
      }
    }
